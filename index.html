<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>

<script>
function startPrank() {

    let audio = new Audio("https://www.soundjay.com/button/beep-07.wav");
    audio.play();

    let text = document.getElementById("text");
    setInterval(() => {
        text.style.color = text.style.color === "red" ? "lime" : "red";
    }, 200);
}
</script>

</head>

<body onload="startPrank()" style="background:black;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;">

<h1 id="text" style="font-size:80px;font-weight:bold;">

</h1>

</body>
</html>
